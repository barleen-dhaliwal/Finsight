<div class="login-shell">
  <div class="login-panel">
    <div class="brand">
      <div class="brand-title">Finsight</div>
      <div class="brand-tag">See the story behind your spending.</div>
    </div>

    <p class="hero-copy">
      Analyze transactions, uncover trends, and gain a clearer view of your finances.
    </p>

    <form class="login-form">
      <mat-form-field appearance="outline" class="full-width modern-field">
        <mat-label>Email</mat-label>
        <input matInput type="email" placeholder="hello@finsight.ai" autocomplete="email" />
        <mat-icon matSuffix>person</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width modern-field">
        <mat-label>Password</mat-label>
        <input
          matInput
          type="password"
          placeholder="Secure passphrase"
          autocomplete="current-password"
        />
        <mat-icon matSuffix>lock</mat-icon>
      </mat-form-field>

      <button mat-raised-button color="primary" class="login-button full-width">Sign in</button>
    </form>

    <div class="page-cta">Don’t have an account? <a routerLink="/sign-up">Sign Up</a></div>
  </div>
</div>
