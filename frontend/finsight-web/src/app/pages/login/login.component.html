<div class="login-shell">
  <div class="login-panel">
    <div class="brand">
      <div class="brand-title">Finsight</div>
      <div class="brand-tag">See the story behind your spending.</div>
    </div>

    <p class="hero-copy">
      Analyze transactions, uncover trends, and gain a clearer view of your finances.
    </p>

    <form class="login-form" [formGroup]="loginForm">
      <mat-form-field appearance="outline" class="full-width modern-field">
        <mat-label>Email</mat-label>
        <input
          matInput
          type="email"
          placeholder="hello@finsight.ai"
          autocomplete="email"
          formControlName="email"
        />
        <mat-icon matSuffix>person</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width modern-field">
        <mat-label>Password</mat-label>
        <input
          matInput
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Password"
          autocomplete="current-password"
          formControlName="password"
        />
        <mat-icon matSuffix (click)="showPassword = !showPassword">
          {{ showPassword ? 'visibility' : 'visibility_off' }}
        </mat-icon>
      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        class="login-button full-width"
        (click)="onSubmit()"
      >
        Sign in
      </button>
    </form>

    <div class="page-cta">Don’t have an account? <a routerLink="/sign-up">Sign Up</a></div>
  </div>
</div>
